<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Micromercado Koki</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div id="header"></div>
<div id="overlay"></div>

<div class="layout">
  <div id="sidebar"></div>

  <main class="contenido">
    <h2>Productos con Fetch</h2>
    <div id="productos" class="grid"></div>

    <h3>Productos (versión con componente web)</h3>
    <div id="componentes-web-container" class="grid"></div>
  </main>

<template id="plantilla-producto">
  <div class="card">
    <img class="producto-imagen" alt="">
    <h4 class="producto-nombre"></h4>
    <p class="producto-precio"></p>
    <p class="producto-descripcion"></p>
    <button class="btn" onclick="agregarAlCarrito()">Agregar 🛒</button>
  </div>
</template>
</div>
<div id="footer"></div>
<script src="js/componentes.js"></script>
<script src="js/main.js"></script>


</body>
</html>
